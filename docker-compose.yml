services:
  postgres:
    image: postgres:16-alpine
    container_name: autolegal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autolegal_control
      POSTGRES_USER: autolegal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - autolegal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autolegal -d autolegal_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autolegal_postgres_data:
